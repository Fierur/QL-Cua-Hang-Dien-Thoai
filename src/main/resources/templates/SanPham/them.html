<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Thêm sản phẩm</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>

<div class="sidebar">
    <div class="sidebar-header">📱 Cửa Hàng ĐT<small>Quản lý hệ thống</small></div>
    <nav>
        <a th:href="@{/}">🏠 Trang chủ</a>
        <a th:href="@{/sanpham}" class="active">📦 Sản phẩm</a>
        <a th:href="@{/khachhang}">👥 Khách hàng</a>
        <a th:href="@{/hoadon}">🧾 Bán hàng</a>
        <a th:href="@{/phieunhap}">📥 Nhập hàng</a>
        <a th:href="@{/baohanh}">🔧 Bảo hành</a>
        <a th:href="@{/baocao}">📊 Báo cáo</a>
        <a th:if="${session.taiKhoan != null and session.taiKhoan.vaiTro == 'ADMIN'}" th:href="@{/taikhoan}">🔑 Tài khoản</a>
    </nav>
    <div class="sidebar-footer">v1.0 - Nhóm 09</div>
</div>

<div class="main">
    <div class="topbar">
        <h1>+ Thêm sản phẩm mới</h1>
        <div class="topbar-right">
            <span th:if="${session.taiKhoan != null and session.taiKhoan.vaiTro == 'ADMIN'}" class="admin-badge">ADMIN</span>
            <span class="user-badge" th:text="${session.taiKhoan?.hoTen}"></span>
            <a th:href="@{/logout}" class="btn btn-secondary btn-sm">Đăng xuất</a>
        </div>
    </div>
    <div class="content">
        <div class="card" style="max-width:700px">
            <div class="card-title">Thông tin sản phẩm</div>
            <form th:action="@{/sanpham/luu}" method="post" th:object="${sp}">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Tên sản phẩm *</label>
                        <input type="text" th:field="*{tenSP}" placeholder="VD: iPhone 15 Pro Max 256GB" required>
                    </div>
                    <div class="form-group">
                        <label>Hãng sản xuất</label>
                        <select th:field="*{hangSX}">
                            <option value="">-- Chọn hãng --</option>
                            <option value="Apple">Apple</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Xiaomi">Xiaomi</option>
                            <option value="OPPO">OPPO</option>
                            <option value="Vivo">Vivo</option>
                            <option value="Realme">Realme</option>
                            <option value="Nokia">Nokia</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Loại sản phẩm</label>
                        <select th:field="*{loaiSP}">
                            <option value="">-- Chọn loại --</option>
                            <option value="Cao cấp">Cao cấp</option>
                            <option value="Tầm trung">Tầm trung</option>
                            <option value="Phổ thông">Phổ thông</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Giá bán (VNĐ) *</label>
                        <input type="number" th:field="*{giaBan}" min="0" placeholder="VD: 29990000" required>
                    </div>
                    <div class="form-group">
                        <label>Số lượng tồn ban đầu</label>
                        <input type="number" th:field="*{soLuongTon}" min="0" value="0">
                    </div>
                    <div class="form-group full">
                        <label>Mô tả</label>
                        <textarea th:field="*{moTa}" placeholder="Mô tả thông số kỹ thuật..."></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Lưu sản phẩm</button>
                    <a th:href="@{/sanpham}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
