<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Quản Lý Cửa Hàng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="login-page">
    <div class="login-box">
        <h2>📱 Cửa Hàng Điện Thoại</h2>
        <p>Đăng nhập để tiếp tục</p>

        <div th:if="${loi}" class="alert alert-danger" th:text="${loi}"></div>

        <form action="/login/xacnhan" method="post">
            <div class="form-group" style="margin-bottom:14px">
                <label>Tên đăng nhập</label>
                <input type="text" name="tenDangNhap" placeholder="Nhập tên đăng nhập" required autofocus>
            </div>
            <div class="form-group" style="margin-bottom:20px">
                <label>Mật khẩu</label>
                <input type="password" name="matKhau" placeholder="Nhập mật khẩu" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">
                Đăng nhập
            </button>
        </form>

        <p style="margin-top:16px;font-size:12px;color:#94a3b8;text-align:center">
            Admin: admin / admin123 &nbsp;|&nbsp; Staff: staff1 / staff123
        </p>
    </div>
</div>
</body>
</html>
