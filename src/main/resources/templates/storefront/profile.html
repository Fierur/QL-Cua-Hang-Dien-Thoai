<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân - TECHSTORE</title>
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <div th:replace="~{storefront/fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        
        <div class="flex flex-col lg:flex-row gap-8">
            <!-- Sidebar -->
            <div class="lg:w-1/4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden sticky top-28">
                    <div class="p-6 text-center border-b border-slate-100 bg-slate-50/50">
                        <div class="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-md">
                            <span class="text-3xl font-bold" th:text="${#strings.substring(customer.tenKH, 0, 1).toUpperCase()}"></span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg" th:text="${customer.tenKH}"></h3>
                        <p class="text-sm text-slate-500 mt-1" th:text="${customer.sdt}"></p>
                    </div>
                    <div class="p-3">
                        <nav class="space-y-1">
                            <a href="/profile" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-700 font-medium transition-colors">
                                <i data-lucide="user" class="w-5 h-5"></i>
                                Hồ sơ cá nhân
                            </a>
                            <a href="/orders/history" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium transition-colors">
                                <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                                Lịch sử đơn hàng
                            </a>
                            <a href="/wishlist" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-slate-900 font-medium transition-colors">
                                <i data-lucide="heart" class="w-5 h-5"></i>
                                Sản phẩm yêu thích
                            </a>
                            <div class="h-px bg-slate-200 my-2 mx-4"></div>
                            <a href="/logout" class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 font-medium transition-colors">
                                <i data-lucide="log-out" class="w-5 h-5"></i>
                                Đăng xuất
                            </a>
                        </nav>
                    </div>
                </div>
            </div>
            
            <!-- Content -->
            <div class="lg:w-3/4 space-y-8">
                
                <!-- Alert Messages -->
                <div th:if="${successMsg}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500"></i>
                    <span th:text="${successMsg}"></span>
                </div>
                
                <div th:if="${pwdSuccessMsg}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl p-4 flex items-center gap-3">
                    <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-500"></i>
                    <span th:text="${pwdSuccessMsg}"></span>
                </div>
                
                <div th:if="${pwdErrorMsg}" class="bg-rose-50 text-rose-700 border border-rose-200 rounded-xl p-4 flex items-center gap-3">
                    <i data-lucide="alert-circle" class="w-5 h-5 text-rose-500"></i>
                    <span th:text="${pwdErrorMsg}"></span>
                </div>

                <!-- Update Info -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="border-b border-slate-200 px-6 py-5">
                        <h2 class="text-xl font-bold text-slate-800">Thông Tin Cáp Nhân</h2>
                        <p class="text-sm text-slate-500 mt-1">Cập nhật thông tin liên hệ và địa chỉ giao hàng.</p>
                    </div>
                    <div class="p-6">
                        <form action="/profile/update" method="POST" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Họ và Tên</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                                        </div>
                                        <input type="text" name="tenKH" th:value="${customer.tenKH}" required
                                               class="pl-10 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                                    </div>
                                </div>
                                
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-2">Số Điện Thoại</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <i data-lucide="phone" class="w-5 h-5 text-slate-400"></i>
                                        </div>
                                        <input type="text" name="sdt" th:value="${customer.sdt}" required
                                               class="pl-10 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                                    </div>
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Địa Chỉ Giao Hàng</label>
                                <div class="relative">
                                    <div class="absolute top-3 left-3 flex items-start pointer-events-none">
                                        <i data-lucide="map-pin" class="w-5 h-5 text-slate-400"></i>
                                    </div>
                                    <textarea name="diaChi" rows="3" required
                                              class="pl-10 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow resize-none"
                                              th:text="${customer.diaChi}"></textarea>
                                </div>
                            </div>
                            
                            <div class="flex justify-end pt-2">
                                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold shadow-sm shadow-indigo-200 transition-all active:scale-[0.98] flex items-center gap-2">
                                    <i data-lucide="save" class="w-5 h-5"></i>
                                    Lưu Thay Đổi
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Change Password -->
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="border-b border-slate-200 px-6 py-5">
                        <h2 class="text-xl font-bold text-slate-800">Đổi Mật Khẩu</h2>
                        <p class="text-sm text-slate-500 mt-1">Đảm bảo tài khoản của bạn đang sử dụng một mật khẩu an toàn.</p>
                    </div>
                    <div class="p-6">
                        <form action="/profile/change-password" method="POST" class="space-y-6 max-w-lg">
                            
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Mật Khẩu Hiện Tại</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                                    </div>
                                    <input type="password" name="currentPassword" required
                                           class="pl-10 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                                </div>
                            </div>
                            
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Mật Khẩu Mới</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                        <i data-lucide="key" class="w-5 h-5 text-slate-400"></i>
                                    </div>
                                    <input type="password" name="newPassword" required
                                           class="pl-10 w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-shadow">
                                </div>
                            </div>
                            
                            <div class="flex pt-2">
                                <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-sm transition-all active:scale-[0.98] flex items-center gap-2">
                                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                                    Cập Nhật Mật Khẩu
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
        
    </main>

    <!-- Footer -->
    <div th:replace="~{storefront/fragments/footer :: footer}"></div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
