<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản Phẩm Yêu Thích - TECHSTORE</title>
    <link href="/css/style.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Navbar -->
    <div th:replace="~{storefront/fragments/navbar :: navbar}"></div>

    <!-- Main Content -->
    <main class="flex-grow pt-28 pb-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto w-full">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-slate-800">Sản Phẩm Yêu Thích</h1>
            <p class="text-slate-500 mt-2">Lưu lại những sản phẩm bạn quan tâm để dễ dàng mua sắm sau.</p>
        </div>

        <div th:if="${dsSP == null or dsSP.empty}" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-12 text-center">
            <div class="w-24 h-24 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="heart" class="w-12 h-12"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">Chưa có sản phẩm yêu thích</h3>
            <p class="text-slate-500 mb-6 max-w-md mx-auto">Bạn chưa lưu sản phẩm nào vào danh sách yêu thích. Hãy quay lại cửa hàng và thả tim những sản phẩm bạn thích nhé!</p>
            <a href="/" class="inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3.5 rounded-xl font-semibold shadow-sm transition-all active:scale-[0.98]">
                Tiếp tục mua sắm
            </a>
        </div>

        <div th:if="${dsSP != null and !dsSP.empty}" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Product Card -->
            <div th:each="sp : ${dsSP}" class="group bg-white rounded-2xl p-3 md:p-4 hover:shadow-xl hover:shadow-indigo-100 transition-all duration-300 relative border border-slate-100 flex flex-col h-full">
                <!-- Heart Icon -->
                <button type="button" th:attr="data-id=${sp.maSP}" class="wishlist-btn absolute top-6 right-6 z-10 w-10 h-10 bg-white/80 backdrop-blur-sm rounded-full flex items-center justify-center text-rose-500 hover:bg-rose-50 hover:scale-110 transition-all shadow-sm">
                    <i data-lucide="heart" class="w-5 h-5 fill-current"></i>
                </button>

                <div class="cursor-pointer flex-grow flex flex-col" th:onclick="'window.location.href=\'/product/' + ${sp.maSP} + '\''">
                    <div class="p-2 pb-0 flex justify-center items-center relative">
                        <div class="w-full aspect-square bg-slate-50 rounded-lg flex items-center justify-center text-slate-300 group-hover:scale-105 transition-transform duration-500 overflow-hidden">
                            <img th:if="${sp.hinhAnhs != null and !#lists.isEmpty(sp.hinhAnhs)}" th:src="${sp.hinhAnhs[0]}" class="w-full h-full object-cover" alt="Product Image">
                            <i th:if="${sp.hinhAnhs == null or #lists.isEmpty(sp.hinhAnhs)}" data-lucide="smartphone" class="w-16 h-16 stroke-[1px]"></i>
                        </div>
                    </div>
                    <div class="p-3 flex flex-col gap-1 flex-grow">
                        <div class="text-xs font-semibold text-indigo-600 uppercase tracking-wider" th:text="${sp.hangSX}"></div>
                        <h3 class="font-semibold text-slate-800 line-clamp-2 leading-snug group-hover:text-indigo-600 transition-colors" th:text="${sp.tenSP}"></h3>
                        <div class="flex items-center gap-2 mt-auto pt-2">
                            <span class="text-lg font-bold text-slate-900" th:text="${#numbers.formatDecimal(sp.giaBan, 0, 'COMMA', 0, 'POINT')} + 'đ'"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{storefront/fragments/footer :: footer}"></div>

    <script>
        lucide.createIcons();

        // Remove from wishlist logic
        document.querySelectorAll('.wishlist-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation(); // Prevent product click
                const maSP = this.getAttribute('data-id');
                let wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
                
                wishlist = wishlist.filter(id => id != maSP);
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                
                // Animate removal and reload
                this.closest('.group').style.transform = 'scale(0.9)';
                this.closest('.group').style.opacity = '0';
                setTimeout(() => {
                    if (wishlist.length > 0) {
                        window.location.href = '/wishlist?ids=' + wishlist.join(',');
                    } else {
                        window.location.href = '/wishlist';
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
