<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Tài khoản - T-Mobile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        indigo: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc', 400: '#818cf8',
                            500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3', 900: '#312e81'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer base {
            body { @apply bg-slate-50 text-slate-700 antialiased; }
            a { @apply no-underline text-inherit; }
            input { @apply w-full px-4 py-3 border border-slate-300 rounded-lg text-sm text-slate-900 bg-white placeholder-slate-400 focus:outline-none focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/15 transition-all; }
            label { @apply text-sm font-medium text-slate-700 block mb-2; }
        }
        @layer components {
            .btn-primary { @apply w-full inline-flex items-center justify-center gap-2 px-4 py-3 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 shadow-sm focus:outline-none focus:ring-4 focus:ring-indigo-600/30 transition-all; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-50 p-4">

    <div class="bg-white rounded-2xl p-10 w-full max-w-[480px] shadow-xl shadow-slate-200/50 border border-slate-100">
        <div class="flex justify-center mb-6 text-indigo-600">
            <i data-lucide="user-plus" class="w-12 h-12 stroke-[1.5px]"></i>
        </div>
        <h2 class="text-2xl font-bold mb-2 text-slate-900 tracking-tight text-center">Tạo tài khoản mới</h2>
        <p class="text-sm text-slate-500 mb-8 text-center">Tham gia để nhận nhiều ưu đãi và quản lý đơn hàng dễ dàng</p>

        <div th:if="${loi}" class="bg-red-50 text-red-700 p-4 rounded-lg text-sm mb-6 flex items-center gap-2 font-medium border border-red-200">
            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
            <span th:text="${loi}"></span>
        </div>

        <form action="/register" method="post" th:object="${khachHang}" class="flex flex-col gap-5">
            <div>
                <label for="tenKH">Họ và tên</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="tenKH" name="tenKH" th:field="*{tenKH}" placeholder="Nhập họ tên của bạn" required class="pl-10">
                </div>
            </div>
            
            <div>
                <label for="sdt">Số điện thoại</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="phone" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="sdt" name="sdt" th:field="*{sdt}" placeholder="Nhập số điện thoại" required class="pl-10">
                </div>
            </div>
            
            <div>
                <label for="email">Email <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </div>
                    <input type="email" id="email" name="email" th:field="*{email}" placeholder="Nhập địa chỉ email" class="pl-10">
                </div>
            </div>

            <div>
                <label for="matKhau">Mật khẩu</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </div>
                    <input type="password" id="matKhau" name="matKhau" th:field="*{matKhau}" placeholder="Tạo mật khẩu" required minlength="6" class="pl-10">
                </div>
                <p class="text-xs text-slate-500 mt-1.5 ml-1">Mật khẩu phải có ít nhất 6 ký tự</p>
            </div>

            <button type="submit" class="btn-primary mt-4">
                Đăng ký tài khoản
            </button>
        </form>

        <p class="text-center text-sm text-slate-500 mt-8">
            Đã có tài khoản? <a href="/login" class="text-indigo-600 font-semibold hover:underline">Đăng nhập</a>
        </p>
        
        <div class="mt-6 pt-6 border-t border-slate-100 flex justify-center">
            <a href="/" class="text-sm text-slate-500 hover:text-indigo-600 font-medium inline-flex items-center gap-2 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Về trang mua sắm
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
