<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{storefront/layout :: layout(~{::div})}">
<head><title>Giỏ hàng - T-Mobile</title></head>
<body>
    <div>
        <h1 class="text-3xl font-bold text-slate-900 mb-8 tracking-tight">Giỏ hàng của bạn</h1>

        <div th:if="${cart == null || cart.chiTiet == null || cart.chiTiet.empty}" class="bg-white rounded-xl shadow-sm border border-slate-200 p-12 text-center">
            <i data-lucide="shopping-cart" class="w-16 h-16 stroke-[1px] text-slate-300 mx-auto mb-4"></i>
            <h2 class="text-xl font-semibold text-slate-900 mb-2">Giỏ hàng trống</h2>
            <p class="text-slate-500 mb-6">Bạn chưa có sản phẩm nào trong giỏ hàng.</p>
            <a href="/" class="btn-primary inline-flex">
                Tiếp tục mua sắm
            </a>
        </div>

        <div th:if="${cart != null && cart.chiTiet != null && !cart.chiTiet.empty}" class="flex flex-col lg:flex-row gap-8">
            <!-- Cart Items -->
            <div class="lg:w-2/3 flex flex-col gap-4">
                <div th:each="item : ${cart.chiTiet}" class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex gap-4 items-center">
                    <div class="w-20 h-20 bg-slate-50 rounded-lg flex items-center justify-center shrink-0 overflow-hidden">
                        <img th:if="${item.sanPham.hinhAnhs != null and !#lists.isEmpty(item.sanPham.hinhAnhs)}" th:src="${item.sanPham.hinhAnhs[0]}" class="w-full h-full object-cover">
                        <i th:if="${item.sanPham.hinhAnhs == null or #lists.isEmpty(item.sanPham.hinhAnhs)}" data-lucide="smartphone" class="w-8 h-8 text-slate-400"></i>
                    </div>
                    
                    <div class="flex-1 min-w-0">
                        <a th:href="@{'/product/' + ${item.sanPham.maSP}}" class="font-semibold text-slate-900 hover:text-indigo-600 truncate block text-base mb-1" th:text="${item.sanPham.tenSP}"></a>
                        <div class="text-sm font-medium text-indigo-600 mb-2" th:text="${#numbers.formatDecimal(item.sanPham.giaBan, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        <div class="text-xs text-slate-500">Số lượng: <span class="font-semibold text-slate-700" th:text="${item.soLuong}"></span></div>
                    </div>

                    <div class="text-right ml-4">
                        <div class="font-bold text-slate-900 mb-3" th:text="${#numbers.formatDecimal(item.sanPham.giaBan * item.soLuong, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        <form action="/cart/remove" method="post">
                            <input type="hidden" name="maSP" th:value="${item.sanPham.maSP}">
                            <button type="submit" class="text-xs font-semibold text-red-500 hover:text-red-700 flex items-center justify-end gap-1 w-full">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Xóa
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Checkout Form -->
            <div class="lg:w-1/3">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sticky top-24">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 border-b border-slate-100 pb-4">Tổng quan đơn hàng</h2>
                    
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-slate-500 font-medium">Tổng tiền:</span>
                        <span class="text-2xl font-bold text-indigo-600" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                    </div>

                    <a href="/checkout" class="btn-primary mt-2 !py-3 !text-base w-full flex justify-center items-center gap-2">
                        Tiến hành thanh toán <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
