<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{storefront/layout :: layout(~{::div})}">
<head><title>Thanh toán - T-Mobile</title></head>
<body>
    <div>
        <h1 class="text-3xl font-bold text-slate-900 mb-8 tracking-tight">Thanh toán</h1>

        <form action="/checkout" method="post" class="flex flex-col lg:flex-row gap-8">
            <!-- Thông tin giao hàng -->
            <div class="lg:w-2/3 flex flex-col gap-6">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-900 mb-6 flex items-center gap-2">
                        <i data-lucide="map-pin" class="w-5 h-5 text-indigo-600"></i> Thông tin giao hàng
                    </h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col gap-2 col-span-full md:col-span-1">
                            <label class="text-sm font-medium text-slate-700">Họ và tên người nhận</label>
                            <input type="text" th:value="${customer.tenKH}" class="px-4 py-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50" readonly>
                        </div>
                        <div class="flex flex-col gap-2 col-span-full md:col-span-1">
                            <label class="text-sm font-medium text-slate-700">Số điện thoại *</label>
                            <input type="text" name="sdtGiao" th:value="${customer.sdt}" required placeholder="09xxxx..." class="px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/15">
                        </div>
                        <div class="flex flex-col gap-2 col-span-full">
                            <label class="text-sm font-medium text-slate-700">Địa chỉ giao hàng chi tiết *</label>
                            <input type="text" name="diaChiGiao" th:value="${customer.diaChi}" required placeholder="Số nhà, tên đường, phường/xã, quận/huyện, tỉnh/thành phố..." class="px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/15">
                        </div>
                        <div class="flex flex-col gap-2 col-span-full">
                            <label class="text-sm font-medium text-slate-700">Ghi chú (Tùy chọn)</label>
                            <textarea name="ghiChu" rows="2" placeholder="Lưu ý cho người giao hàng..." class="px-4 py-2.5 border border-slate-300 rounded-lg text-sm focus:border-indigo-600 focus:ring-4 focus:ring-indigo-600/15"></textarea>
                        </div>
                    </div>
                </div>

                <!-- Phương thức thanh toán -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-semibold text-slate-900 mb-6 flex items-center gap-2">
                        <i data-lucide="credit-card" class="w-5 h-5 text-indigo-600"></i> Phương thức thanh toán
                    </h2>
                    
                    <div class="flex flex-col gap-3">
                        <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors">
                            <input type="radio" name="hinhThucTT" value="TIEN_MAT" checked class="w-4 h-4 text-indigo-600">
                            <div class="flex-1">
                                <div class="font-medium text-slate-900">Thanh toán khi nhận hàng (COD)</div>
                                <div class="text-sm text-slate-500">Thanh toán bằng tiền mặt khi giao hàng tận nơi.</div>
                            </div>
                            <i data-lucide="banknote" class="w-6 h-6 text-slate-400"></i>
                        </label>
                        
                        <label class="flex items-center gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors">
                            <input type="radio" name="hinhThucTT" value="CHUYEN_KHOAN" class="w-4 h-4 text-indigo-600">
                            <div class="flex-1">
                                <div class="font-medium text-slate-900">Chuyển khoản ngân hàng</div>
                                <div class="text-sm text-slate-500">Quét mã QR hoặc chuyển khoản qua STK.</div>
                            </div>
                            <i data-lucide="qr-code" class="w-6 h-6 text-slate-400"></i>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Tổng kết đơn hàng -->
            <div class="lg:w-1/3">
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 sticky top-24">
                    <h2 class="text-lg font-semibold text-slate-900 mb-6">Tóm tắt đơn hàng</h2>
                    
                    <div class="flex flex-col gap-4 mb-6">
                        <div th:each="item : ${cart.chiTiet}" class="flex gap-3 items-center">
                            <div class="w-12 h-12 bg-slate-50 rounded overflow-hidden shrink-0">
                                <img th:if="${item.sanPham.hinhAnhs != null and !#lists.isEmpty(item.sanPham.hinhAnhs)}" th:src="${item.sanPham.hinhAnhs[0]}" class="w-full h-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-sm font-medium text-slate-900 truncate" th:text="${item.sanPham.tenSP}"></div>
                                <div class="text-xs text-slate-500">SL: <span th:text="${item.soLuong}"></span></div>
                            </div>
                            <div class="text-sm font-semibold text-slate-900 shrink-0" th:text="${#numbers.formatDecimal(item.sanPham.giaBan * item.soLuong, 0, 'COMMA', 0, 'POINT')} + ' đ'"></div>
                        </div>
                    </div>
                    
                    <div class="border-t border-slate-200 pt-4 flex flex-col gap-2 mb-6">
                        <div class="flex justify-between text-slate-500 text-sm">
                            <span>Tạm tính (<span th:text="${cartCount}"></span> sản phẩm)</span>
                            <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </div>
                        <div class="flex justify-between text-slate-500 text-sm">
                            <span>Phí vận chuyển</span>
                            <span class="text-emerald-600 font-medium">Miễn phí</span>
                        </div>
                    </div>
                    
                    <div class="border-t border-slate-200 pt-4 mb-6">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-semibold text-slate-900">Tổng cộng</span>
                            <span class="text-2xl font-bold text-indigo-600" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                        </div>
                        <div class="text-right text-xs text-slate-400">(Đã bao gồm VAT)</div>
                    </div>
                    
                    <button type="submit" class="w-full btn-primary !py-3.5 !text-base">
                        Đặt hàng ngay
                    </button>
                    
                    <a href="/cart" class="w-full text-center mt-4 text-sm font-medium text-slate-500 hover:text-indigo-600 inline-block transition-colors">
                        <i data-lucide="arrow-left" class="w-4 h-4 inline align-text-bottom"></i> Quay lại giỏ hàng
                    </a>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
