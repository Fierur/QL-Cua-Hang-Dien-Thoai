<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Tạo phiếu nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body>
<div class="sidebar">
    <div class="sidebar-header">📱 Cửa Hàng ĐT<small>Quản lý hệ thống</small></div>
    <nav>
        <a th:href="@{/}">🏠 Trang chủ</a>
        <a th:href="@{/sanpham}">📦 Sản phẩm</a>
        <a th:href="@{/khachhang}">👥 Khách hàng</a>
        <a th:href="@{/hoadon}">🧾 Bán hàng</a>
        <a th:href="@{/phieunhap}" class="active">📥 Nhập hàng</a>
        <a th:href="@{/baohanh}">🔧 Bảo hành</a>
        <a th:href="@{/baocao}">📊 Báo cáo</a>
        <a th:if="${session.taiKhoan != null and session.taiKhoan.vaiTro == 'ADMIN'}" th:href="@{/taikhoan}">🔑 Tài khoản</a>
    </nav>
    <div class="sidebar-footer">v1.0 - Nhóm 09</div>
</div>
<div class="main">
    <div class="topbar">
        <h1>📥 Tạo phiếu nhập kho</h1>
        <div class="topbar-right">
            <span th:if="${session.taiKhoan != null and session.taiKhoan.vaiTro == 'ADMIN'}" class="admin-badge">ADMIN</span>
            <span class="user-badge" th:text="${session.taiKhoan?.hoTen}"></span>
            <a th:href="@{/logout}" class="btn btn-secondary btn-sm">Đăng xuất</a>
        </div>
    </div>
    <div class="content">
        <div class="card" style="max-width:700px">
            <div class="card-title">Thông tin phiếu nhập</div>
            <form action="/phieunhap/luu" method="post">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nhà cung cấp *</label>
                        <select name="maNCC" required>
                            <option value="">-- Chọn NCC --</option>
                            <option th:each="ncc : ${dsNCC}"
                                    th:value="${ncc.maNCC}"
                                    th:text="${ncc.tenNCC}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Sản phẩm nhập *</label>
                        <select name="maSP" required>
                            <option value="">-- Chọn sản phẩm --</option>
                            <option th:each="sp : ${dsSP}"
                                    th:value="${sp.maSP}"
                                    th:text="${sp.tenSP}">
                            </option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Số lượng nhập</label>
                        <input type="number" name="soLuong" min="1" value="1"
                               placeholder="Số lượng sẽ tính tự động từ IMEI">
                    </div>
                    <div class="form-group">
                        <label>Giá nhập (VNĐ/máy) *</label>
                        <input type="number" name="giaNhap" min="0" placeholder="VD: 28000000" required>
                    </div>
                    <div class="form-group full">
                        <label>Danh sách IMEI *
                            <small style="font-weight:400;color:#94a3b8">(mỗi IMEI 1 dòng hoặc cách nhau bằng dấu phẩy)</small>
                        </label>
                        <textarea name="danhSachImei" rows="5"
                                  placeholder="352999001234001&#10;352999001234002&#10;352999001234003" required></textarea>
                    </div>
                    <div class="form-group full">
                        <label>Ghi chú</label>
                        <input type="text" name="ghiChu" placeholder="Ghi chú thêm (nếu có)">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-warning">💾 Lưu phiếu nhập</button>
                    <a th:href="@{/phieunhap}" class="btn btn-secondary">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
